services:
  - type: web
    name: opengym-facu-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATA_DIR
        value: /tmp/opengym-data
      - key: DATABASE_URL
        sync: false
      - key: RP_ID
        sync: false
      - key: ORIGIN
        sync: false
      - key: RP_NAME
        value: openGym
